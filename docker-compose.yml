services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: universum
      POSTGRES_PASSWORD: universum
      POSTGRES_DB: moodle_universum
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U universum -d moodle_universum"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      # Same-origin via Caddy makes CORS moot for the public domain, but keep
      # localhost allowed too for direct-to-backend debugging.
      CORS_ORIGIN: http://localhost:5173,https://${DOMAIN:-localhost}
      DATABASE_URL: postgresql://universum:universum@postgres:5432/moodle_universum
      MOODLE_PROVIDER: mock
      MOODLE_BASE_URL: ${MOODLE_BASE_URL:-}
      MOODLE_TOKEN: ${MOODLE_TOKEN:-}
      MOODLE_TIMEOUT_MS: 10000
      AUTH_MODE: dev
      DEV_DEFAULT_ROLE: student
    ports:
      # Bound to localhost only — publicly reachable traffic goes through
      # the caddy service instead. Use `ssh -L 4000:localhost:4000 ...` to
      # reach this remotely for debugging.
      - "127.0.0.1:4000:4000"
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
      - ./shared/src:/app/shared/src

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Read by vite.config.ts to populate server.allowedHosts.
      DOMAIN: ${DOMAIN:-}
      # Relative path: Caddy proxies /api/* to the backend under the same
      # origin as the frontend, so no absolute URL or CORS is needed for
      # traffic that comes in through the domain.
      VITE_API_BASE_URL: /api
      VITE_MOODLE_BASE_URL: ${MOODLE_BASE_URL:-https://moodle.example.org}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./shared/src:/app/shared/src

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. universum.timopuistaja.eu}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
