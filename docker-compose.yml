services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: universum
      POSTGRES_PASSWORD: universum
      POSTGRES_DB: moodle_universum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U universum -d moodle_universum"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://universum:universum@postgres:5432/moodle_universum
      MOODLE_PROVIDER: mock
      MOODLE_BASE_URL: ${MOODLE_BASE_URL:-}
      MOODLE_TOKEN: ${MOODLE_TOKEN:-}
      MOODLE_TIMEOUT_MS: 10000
      AUTH_MODE: dev
      DEV_DEFAULT_ROLE: student
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
      - ./shared/src:/app/shared/src

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api
      VITE_MOODLE_BASE_URL: ${MOODLE_BASE_URL:-https://moodle.example.org}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./shared/src:/app/shared/src

volumes:
  postgres_data:
